[project]
name = "mars-remote-sensing-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrea Blushi", email = "andreablushi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "rich>=14.0.0",
    "shapely>=2.1.2",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["common", "download", "analysis", "visualization"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
notebook = [
    "ipywidgets>=8.1.5",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
