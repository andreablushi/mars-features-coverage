# What a window has to hold before a feature earns a place in the dataset.

# The coverage each instrument is asked of a feature, in percent of its area.
constraints:
  - {CTX: 0.50}
  - {CRISM: 0.30}
  - {SHARAD: 0.0}

# The pixels an instrument has to land on a feature to be counted, at powers of two
# is preferable
admits: {CTX: 65536, CRISM: 4096, SHARAD: 64}

# How long a window may run, in days.
span_days: 140.0

# What instruments are excluded from the window, and kept for the feature whenever
# they came.
timeless: [SHARAD]
