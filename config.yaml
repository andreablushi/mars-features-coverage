pipeline:
  # Keep each set's metadata once its coverage is computed. Off makes the
  # artifacts final: nothing recomputes without downloading again.
  keep_metadata: true

  # Measure what is already on disk, downloading nothing.
  coverage_only: false

  # Re-fetch the ODE feature and instrument catalogues instead of the cache.
  refresh_catalog: false

download:
  # IHID/IID/PT, optionally followed by a colon and an ODE product id pattern
  # to narrow a product type to one observing mode. A set must publish both a
  # footprint and an acquisition time, and the run refuses one that does not.
  instruments:
    - MRO/CTX/EDR
    - MRO/HIRISE/RDRV11
    - MRO/CRISM/MTRDR
    - MRO/CRISM/TRDR:[mh]sp*   # the multispectral survey, not the whole type
    - MRO/SHARAD/USRDRV2

  # Restrict the run to named features. Comment out for the whole catalogue.
  # features:
  #   - Gale
  #   - Jezero

  # Half-width of the box put around a feature catalogued by centre alone,
  # in degrees of latitude. Only craters and landing sites are sized this way.
  point_radius_deg: 0.25

  # Which products a feature's box returns.
  #   b  the product's own box overlaps it
  #   f  the product's footprint overlaps it, even partly
  #   o  the product falls entirely inside it
  #   i  the product contains the whole feature
  loc: f

  # Re-download instead of skipping sets already on disk.
  force: false

  # Concurrent downloads.
  workers: 4

coverage:
  # Accumulate the running union, which is the expensive half. Off leaves the
  # cumulative columns empty, so no coverage fraction and no cumulative plot.
  cumulative_union: true

  # Recompute instead of skipping sets already computed.
  force: false

  # Concurrent worker processes.
  workers: 4
