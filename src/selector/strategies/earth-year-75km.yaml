# A window over one Earth year, cut into 75 km tiles

# The coverage each instrument is asked of a tile, in percent of its area.
constraints:
  - {CTX: 0.50}
  - {CRISM: 0.30}
  - {SHARAD: 0.0}

# The pixels an instrument has to land on a tile to be counted, at powers of two
# is preferable
admits: {CTX: 65536, CRISM: 4096, SHARAD: 64}

# How wide a tile of a feature is, in kilometres.
tile_km: 75.0

# How long a window may run, in days.
span_days: 365.0

# What instruments are excluded from the window, and kept for the tile whenever
# they came.
timeless: [SHARAD]
