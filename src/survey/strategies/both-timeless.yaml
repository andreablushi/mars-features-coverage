# Both imagers rather than either, with the sounder still asked of the whole
# record. CTX gives the shape of the ground and CRISM what it is made of, and
# demanding them separately means a window has to hold the two together rather
# than settling for whichever one came. It keeps far less than `surface-timeless`
# does, since a feature CRISM never visited now earns nothing at all, which is
# the price of asking for composition everywhere.
demands:
  - {CTX: 0.25}
  - {CRISM: 0.10}
  - {SHARAD: 0.0}
admits: {CTX: 5, CRISM: 5, SHARAD: 16}
tile_km: 20.0
span_days: 687.0
timeless: [SHARAD]
