# Every setting a strategy can carry is written out here

# The coverage each instrument is asked of a tile, in percent of its area.
demands:
  - {CTX: 0.50}
  - {CRISM: 0.30}
  - {SHARAD: 0.0}

# The pixels an instrument has to land on a tile to be counted
# One ground floor of about 25 km2, read at each instrument's own pixel size
admits: {CTX: 1000000, CRISM: 800, SHARAD: 50}

# How wide a tile of a feature is, in kilometres.
# 100 km is where a tile holds the most SHARAD: below it the radar thins out,
# above it a feature stops being split and the median tile shrinks again
tile_km: 100.0

# The cells an observation has to bring a window that no other observation of
# its own set already reaches. At one, every look that adds ground is merged
gain: 1

# How much a window is worth for each extra instrument answering the same
# demand.
breadth: 0.7

# How long a window may run, in days.
span_days: 687.0

# What instruments are excluded from the window, and kept for the tile whenever
# they came.
timeless: [SHARAD]
