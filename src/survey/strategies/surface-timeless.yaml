# The same demands, with the sounder asked of the whole record rather than the
# window. What a sounder reads is the rock under the ground, which the seasons
# do not turn, so the window closes around the imagery alone instead of
# stretching to the next time SHARAD flew over.
demands:
  - {CTX: 0.25, CRISM: 0.10}
  - {SHARAD: 0.0}
admits: {CTX: 1, CRISM: 1, SHARAD: 5}
tile_km: 20.0
# What the window gains for each instrument answering a demand beyond the
# first. Imagery and spectra of the same ground are worth more than either
# alone, so a window holding both is worth waiting for, though not for ever:
# at a half, a full window buys a second instrument with about 500 days.
breadth: 0.5
span_days: 687.0
timeless: [SHARAD]
